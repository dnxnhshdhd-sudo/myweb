<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Ảnh Của Tao</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #00ff88; }
        .admin-panel { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc66; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .img-card { position: relative; border-radius: 8px; overflow: hidden; background: #333; }
        .img-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .btn-del { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <h1>BỘ SỰU TẬP ẢNH</h1>

    <!-- Nút Đăng Nhập Admin -->
    <div style="margin-bottom: 20px;">
        <button id="btnLogin" onclick="loginAdmin()">🔑 Đăng nhập Admin</button>
        <button id="btnLogout" onclick="logoutAdmin()" style="display:none; background: #ff4444; color: #fff;">🚪 Đăng xuất</button>
    </div>

    <!-- Khu vực Admin mới thấy -->
    <div id="adminArea" class="admin-panel" style="display: none;">
        <h3>🛠 QUYỀN ADMIN: THÊM ẢNH MỚI</h3>
        <input type="file" id="imgInput" accept="image/*">
        <button onclick="addSingleImage()">Tải Ảnh Up</button>
    </div>

    <!-- Nơi hiện ảnh cho mọi người xem -->
    <div class="gallery" id="gallery"></div>

    <script>
        // Mật khẩu Admin mày tự chỉnh ở đây nhé (mặc định tao để 123456)
        const ADMIN_PASS = "123456"; 
        let isAdmin = false;

        // Lấy ảnh đã lưu từ trước (trong bộ nhớ trình duyệt)
        let savedImages = JSON.parse(localStorage.getItem('my_web_photos')) || [];

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            savedImages.forEach((imgSrc, index) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                card.innerHTML = `
                    <img src="${imgSrc}">
                    <button class="btn-del" style="display: ${isAdmin ? 'block' : 'none'}" onclick="deleteImg(${index})">Xóa</button>
                `;
                gallery.appendChild(card);
            });
        }

        function loginAdmin() {
            let pass = prompt("Nhập mật khẩu Admin của mày:");
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                alert("Đăng nhập thành công! Giờ mày có quyền tải ảnh & xóa ảnh.");
                document.getElementById('adminArea').style.display = 'block';
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'inline-block';
                renderGallery();
            } else if (pass !== null) {
                alert("Sai mật khẩu rồi cu!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminArea').style.display = 'none';
            document.getElementById('btnLogin').style.display = 'inline-block';
            document.getElementById('btnLogout').style.display = 'none';
            renderGallery();
        }

        function addSingleImage() {
            const fileInput = document.getElementById('imgInput');
            const file = fileInput.files[0];

            if (!file) {
                alert("Chọn cái ảnh nào đã ông cháu!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                savedImages.push(e.target.result);
                localStorage.setItem('my_web_photos', JSON.stringify(savedImages));
                renderGallery();
                fileInput.value = ''; 
            };
            reader.readAsDataURL(file);
        }

        function deleteImg(index) {
            if (confirm("Muốn xóa ảnh này thật à?")) {
                savedImages.splice(index, 1);
                localStorage.setItem('my_web_photos', JSON.stringify(savedImages));
                renderGallery();
            }
        }

        // Tự động load ảnh khi mở web
        renderGallery();
    </script>
</body>
</html>
